<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">wangshen233 / Build with curiosity</title>
  <desc id="desc">A dark terminal with mint and coral accents, an animated signal, and Python, protocols, automation text.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity=".045"/>
    </pattern>
    <clipPath id="terminal-clip"><rect x="752" y="83" width="400" height="211" rx="6"/></clipPath>
  </defs>
  <style>
    text { font-family: 'Cascadia Code', 'SFMono-Regular', Consolas, monospace; letter-spacing: 0; }
    .cursor { animation: blink 1.2s steps(1) infinite; }
    .packet { animation: travel 5s linear infinite; }
    .signal { animation: pulse 3s ease-in-out infinite; }
    @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
    @keyframes travel { from { transform: translateX(-180px); } to { transform: translateX(430px); } }
    @keyframes pulse { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .cursor, .packet, .signal { animation: none; } }
  </style>
  <rect width="1200" height="360" rx="8" fill="#101317"/>
  <rect width="1200" height="360" rx="8" fill="url(#grid)"/>
  <path d="M0 1H1200" stroke="#58e6c2" stroke-width="2"/>
  <path d="M48 47H76M48 47V75M1152 313H1124M1152 313V285" fill="none" stroke="#59616c"/>
  <circle cx="70" cy="89" r="4" fill="#58e6c2" class="signal"/>
  <text x="85" y="94" fill="#a8b0bd" font-size="14">PERSONAL LAB / WANGSHEN233</text>
  <text x="63" y="164" fill="#f1f5f9" font-size="58" font-weight="700">wangshen233<tspan fill="#58e6c2">_</tspan></text>
  <text x="66" y="206" fill="#c8d0db" font-size="21">Build with curiosity.</text>
  <text x="66" y="253" fill="#58e6c2" font-size="14">PYTHON</text>
  <text x="151" y="253" fill="#65707f" font-size="14">/</text>
  <text x="177" y="253" fill="#f6a57f" font-size="14">PROTOCOLS</text>
  <text x="288" y="253" fill="#65707f" font-size="14">/</text>
  <text x="315" y="253" fill="#e7edf4" font-size="14">AUTOMATION</text>
  <text x="66" y="303" fill="#7f8997" font-size="12">READ. EXPERIMENT. BUILD. REPEAT.</text>
  <g clip-path="url(#terminal-clip)">
    <rect x="752" y="83" width="400" height="211" rx="6" fill="#171b21" stroke="#353d48" stroke-width="2"/>
    <path d="M752 117H1152" stroke="#353d48"/>
    <circle cx="771" cy="100" r="4" fill="#f6a57f"/>
    <circle cx="786" cy="100" r="4" fill="#d9c678"/>
    <circle cx="801" cy="100" r="4" fill="#58e6c2"/>
    <text x="827" y="104" fill="#909aa7" font-size="11">~/wangshen233</text>
    <text x="773" y="148" fill="#58e6c2" font-size="14">$ <tspan fill="#e7edf4">python curiosity.py</tspan></text>
    <text x="773" y="180" fill="#7f8997" font-size="13">[01] <tspan fill="#c8d0db">follow the request</tspan></text>
    <text x="773" y="206" fill="#7f8997" font-size="13">[02] <tspan fill="#c8d0db">understand the protocol</tspan></text>
    <text x="773" y="232" fill="#7f8997" font-size="13">[03] <tspan fill="#c8d0db">make something useful</tspan></text>
    <text x="773" y="268" fill="#f6a57f" font-size="13">&gt; <tspan fill="#58e6c2">keep building</tspan></text>
    <rect x="903" y="257" width="8" height="14" fill="#58e6c2" class="cursor"/>
    <path d="M752 292H1152" stroke="#29323b" stroke-width="2"/>
    <rect x="752" y="291" width="130" height="2" fill="#58e6c2" class="packet"/>
  </g>
  <text x="1152" y="337" text-anchor="end" fill="#7f8997" font-size="10">IDEA / CODE / SHIP</text>
</svg>
