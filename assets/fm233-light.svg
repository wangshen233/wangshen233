ate attributeName="height" values="9;23;9" dur="0.78s" begin="-0.91s" repeatCount="indefinite"/><animate attributeName="y" values="77;63;77" dur="0.78s" begin="-0.91s" repeatCount="indefinite"/></rect><rect x="226.0" y="81" width="4.2" height="5" rx="2" fill="#9b51e0"><animate attributeName="height" values="5;15;5" dur="0.88s" begin="-1.04s" repeatCount="indefinite"/><animate attributeName="y" values="81;71;81" dur="0.88s" begin="-1.04s" repeatCount="indefinite"/></rect>
  <text x="242" y="83" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans','Microsoft YaHei',sans-serif" font-size="10.5" fill="#987a88">銀河海列 · 炫彩黑胶电台</text>

