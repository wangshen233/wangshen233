<svg xmlns="http://www.w3.org/2000/svg" width="380" height="252" viewBox="0 0 380 252" role="img" aria-labelledby="title desc">
  <title id="title">值班站长三花</title>
  <desc id="desc">A paper card with the station-master cat 三花 in a red cap, a waving flag, a swinging bell and a speech bubble that cycles through five short messages while paper cranes drift past.</desc>
  <defs>
    <linearGradient id="paper" x2="1" y2="1"><stop stop-color="#faf4e7"/><stop offset="1" stop-color="#ede0c9"/></linearGradient>
      <pattern id="ripple" width="160" height="40" patternUnits="userSpaceOnUse"><path d="M-40 20Q0 2 40 20T120 20T200 20" fill="none" stroke="#7e9a98" stroke-width="1" opacity=".13"/></pattern>
      
    <g id="crane" fill="#fbeecd" stroke="#b08b4a" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round">
      <path d="M0 0L-37 -35L-14 9L6 1L27 -39L14 12L6 1L0 0L-14 9L-6 18L6 1"/>
      <path d="M0 0L-37 -35M6 1L27 -39M-14 9L6 1" fill="none" stroke-width="1.4"/>
    </g>
    <clipPath id="card"><rect width="380" height="252" rx="20"/></clipPath>
  </defs>
  <g clip-path="url(#card)">
    <rect width="380" height="252" fill="url(#paper)"/>
    <g><rect x="-180" width="820" height="252" fill="url(#ripple)"/>
      <animateTransform attributeName="transform" type="translate" from="0 0" to="160 0" dur="19s" repeatCount="indefinite"/></g>
    <g opacity="0">
        <use href="#crane" transform="scale(0.36)"/>
        <animateTransform attributeName="transform" type="translate" values="168 180;350 168" dur="17s" begin="-9s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;.85;.85;0" keyTimes="0;.15;.82;1" dur="17s" begin="-9s" repeatCount="indefinite"/>
      </g><g opacity="0">
        <use href="#crane" transform="scale(0.26)"/>
        <animateTransform attributeName="transform" type="translate" values="198 204;342 196" dur="23s" begin="-6s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;.85;.85;0" keyTimes="0;.15;.82;1" dur="23s" begin="-6s" repeatCount="indefinite"/>
      </g>
    <path d="M24 212H356" stroke="#7c7567" stroke-width="1" opacity=".28"/>
    <g transform="translate(14 0)">
      <path d="M144 208C174 206 188 194 185 178C182 168 186 164 192 162" fill="none" stroke="#274d57" stroke-width="7" stroke-linecap="round">
        <animateTransform attributeName="transform" type="rotate" values="-4 144 208;4 144 208;-4 144 208" dur="4.2s" repeatCount="indefinite"/>
      </path>
      <path d="M78 212Q74 152 112 150Q150 152 146 212Z" fill="#274d57"/>
      <path d="M82 96L74 56L110 84Z" fill="#274d57"/>
      <g>
        <path d="M142 96L150 56L114 84Z" fill="#274d57"/>
        <animateTransform attributeName="transform" type="rotate" values="0 142 96;0 142 96;7 142 96;0 142 96;0 142 96" keyTimes="0;.6;.66;.74;1" dur="7s" repeatCount="indefinite"/>
      </g>
      <path d="M86 92L80 66L104 86Z" fill="#b75640" opacity=".55"/>
      <path d="M138 92L144 66L120 86Z" fill="#b75640" opacity=".55"/>
      <ellipse cx="112" cy="186" rx="21" ry="27" fill="#faf4e7" opacity=".93"/>
      <ellipse cx="98" cy="206" rx="13" ry="8" fill="#faf4e7" opacity=".93"/>
      <ellipse cx="126" cy="206" rx="13" ry="8" fill="#faf4e7" opacity=".93"/>
      <path d="M98 200v8M108 200v8M126 200v8M136 200v8" stroke="#274d57" stroke-width="1" opacity=".35"/>
      <path d="M94 159Q112 172 130 159" fill="none" stroke="#b75640" stroke-width="2.6" opacity=".9"/>
      <g transform="translate(112 170)">
        <circle r="6" fill="#f6d69b" stroke="#274d57" stroke-width="1.2"/>
        <path d="M-2.5 3h5" stroke="#274d57" stroke-width="1.1"/>
        <animateTransform attributeName="transform" type="rotate" values="-9;9;-9" dur="2.6s" additive="sum" repeatCount="indefinite"/>
      </g>
      <circle cx="112" cy="120" r="41" fill="#274d57"/>
      <path d="M74 90Q76 56 112 56Q148 56 150 90Z" fill="#b75640"/>
      <path d="M64 90Q112 102 160 90Q112 96 64 90Z" fill="#8f3f31"/>
      <path d="M0 -8L2.23 -3.07L7.61 -2.47L3.61 1.17L4.7 6.47L0 3.8L-4.7 6.47L-3.61 1.17L-7.61 -2.47L-2.23 -3.07Z" transform="translate(112 74)" fill="#f6d69b"/>
