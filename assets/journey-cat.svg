      <circle cx="112" cy="120" r="41" fill="#274d57"/>
      <path d="M74 90Q76 56 112 56Q148 56 150 90Z" fill="#b75640"/>
      <path d="M64 90Q112 102 160 90Q112 96 64 90Z" fill="#8f3f31"/>
