      </ellipse>
      <path d="M108 140H116L112 146Z" fill="#f6d69b"/>
      <path d="M112 146q-5 6 -10 2M112 146q5 6 10 2" fill="none" stroke="#f6d69b" stroke-width="1.6" stroke-linecap="round"/>
