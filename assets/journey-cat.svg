      <circle cx="112" cy="74" r="2" fill="#274d57"/>
      <ellipse cx="98" cy="126" rx="5.5" ry="6.5" fill="#f6d69b">
        <animate attributeName="ry" values="6.5;6.5;0.8;6.5;6.5" keyTimes="0;.44;.5;.56;1" dur="5s" repeatCount="indefinite"/>
