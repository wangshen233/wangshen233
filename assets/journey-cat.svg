<svg xmlns="http://www.w3.org/2000/svg" width="380" height="252" viewBox="0 0 380 252" role="img" aria-labelledby="title desc">
  <title id="title">值班站长三花</title>
  <desc id="desc">A paper card with the station-master cat 三花 in a red cap, a waving flag and a speech bubble that cycles through five short messages.</desc>
  <defs>
    <linearGradient id="paper" x2="1" y2="1"><stop stop-color="#faf4e7"/><stop offset="1" stop-color="#ede0c9"/></linearGradient>
      <pattern id="ripple" width="160" height="40" patternUnits="userSpaceOnUse"><path d="M-40 20Q0 2 40 20T120 20T200 20" fill="none" stroke="#7e9a98" stroke-width="1" opacity=".13"/></pattern>
      
    <clipPath id="card"><rect width="380" height="252" rx="20"/></clipPath>
  </defs>
  <g clip-path="url(#card)">
    <rect width="380" height="252" fill="url(#paper)"/>
    <g><rect x="-180" width="820" height="252" fill="url(#ripple)"/>
      <animateTransform attributeName="transform" type="translate" from="0 0" to="160 0" dur="19s" repeatCount="indefinite"/></g>
    <path d="M24 212H356" stroke="#7c7567" stroke-width="1" opacity=".28"/>
    <g transform="translate(14 0)">
