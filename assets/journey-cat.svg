    <path d="M216 52H342Q358 52 358 68V132Q358 148 342 148H216Q200 148 200 132V130L176 118L200 106V68Q200 52 216 52Z" fill="#fffbf2" stroke="#274d57" stroke-width="1.6"/>
    <text x="279" y="106" text-anchor="middle" font-family="'STKaiti','KaiTi','Microsoft YaHei',serif" font-size="15" fill="#274d57" letter-spacing="1" opacity="0">喵～<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.0000;0.0120;0.1880;0.2000;1" dur="25s" begin="-4s" repeatCount="indefinite"/></text><text x="279" y="106" text-anchor="middle" font-family="'STKaiti','KaiTi','Microsoft YaHei',serif" font-size="15" fill="#274d57" letter-spacing="1" opacity="0">车票拿好。<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.2000;0.2120;0.3880;0.4000;1" dur="25s" begin="-4s" repeatCount="indefinite"/></text><text x="279" y="106" text-anchor="middle" font-family="'STKaiti','KaiTi','Microsoft YaHei',serif" font-size="15" fill="#274d57" letter-spacing="1" opacity="0">别熬太晚。<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.4000;0.4120;0.5880;0.6000;1" dur="25s" begin="-4s" repeatCount="indefinite"/></text><text x="279" y="106" text-anchor="middle" font-family="'STKaiti','KaiTi','Microsoft YaHei',serif" font-size="15" fill="#274d57" letter-spacing="1" opacity="0">灵感放好，<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.6000;0.6120;0.7880;0.8000;1" dur="25s" begin="-4s" repeatCount="indefinite"/></text><text x="279" y="106" text-anchor="middle" font-family="'STKaiti','KaiTi','Microsoft YaHei',serif" font-size="15" fill="#274d57" letter-spacing="1" opacity="0">开个新坑？<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.8000;0.8120;0.9880;1.0000;1" dur="25s" begin="-4s" repeatCount="indefinite"/></text>
    <text x="24" y="238" font-family="ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace" font-size="9" fill="#7c7567" letter-spacing="2">STATION MASTER 三花 · 24 小时在岗</text>
  </g>
