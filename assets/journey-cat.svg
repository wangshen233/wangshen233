      <path d="M112 146q-5 6 -10 2M112 146q5 6 10 2" fill="none" stroke="#f6d69b" stroke-width="1.6" stroke-linecap="round"/>
      <path d="M88 134H62M88 143H66M136 134H162M136 143H158" stroke="#f6d69b" stroke-width="1.4" stroke-linecap="round" opacity=".55"/>
      <ellipse cx="112" cy="186" rx="21" ry="27" fill="#faf4e7" opacity=".93"/>
