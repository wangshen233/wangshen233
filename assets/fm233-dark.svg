<svg xmlns="http://www.w3.org/2000/svg" width="406" height="196" viewBox="0 0 406 196" role="img" aria-labelledby="title desc">
  <title id="title">FM 233.0 茜色海列电台 · 6番目の駅</title>
  <desc id="desc">Spinning vinyl player with sakura-peach sunset gradients and live GitHub counters.</desc>
  <defs>
    <linearGradient id="sunsetText" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff7aa2"/>
      <stop offset=".55" stop-color="#ff9a76"/>
      <stop offset="1" stop-color="#ffc978"/>
    </linearGradient>
    <linearGradient id="sunsetBorder" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5c3445"/>
      <stop offset="1" stop-color="#593934"/>
    </linearGradient>
    <linearGradient id="sunsetFadeRule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff7aa2" stop-opacity=".65"/>
      <stop offset=".5" stop-color="#ff9a76" stop-opacity=".35"/>
      <stop offset="1" stop-color="#ffc978" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="deckBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#181316"/>
      <stop offset=".55" stop-color="#21171d"/>
      <stop offset="1" stop-color="#24191b"/>
    </linearGradient>
    <radialGradient id="auraTop" cx=".88" cy=".12" r=".65">
      <stop offset="0" stop-color="#ff6b95" stop-opacity=".18"/>
      <stop offset="1" stop-color="#ff6b95" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="auraBot" cx=".15" cy=".88" r=".6">
      <stop offset="0" stop-color="#ffa26b" stop-opacity=".18"/>
      <stop offset="1" stop-color="#ffa26b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".16"/>
      <stop offset=".45" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset=".55" stop-color="#ffffff" stop-opacity=".11"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="deckClip"><rect width="406" height="196" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#deckClip)">
    <rect width="406" height="196" fill="url(#deckBg)"/>
    <rect width="406" height="196" fill="url(#auraTop)"/>
    <rect width="406" height="196" fill="url(#auraBot)"/>
  </g>
  <rect x=".75" y=".75" width="404.5" height="194.5" rx="17.25" fill="none" stroke="url(#sunsetBorder)" stroke-width="1.3"/>

  <!-- Spinning Sunset-Gradient Vinyl Record -->
