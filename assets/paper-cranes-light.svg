<svg xmlns="http://www.w3.org/2000/svg" width="880" height="150" viewBox="0 0 880 150" role="img" aria-labelledby="title desc">
  <title id="title">茜色の海 · Visitor Paper Boats</title>
  <desc id="desc">Interactive sunset-rose sea carrying visitor paper boats and messages submitted via GitHub Issues.</desc>
  <defs>
    <linearGradient id="sunsetText" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e85d88"/>
      <stop offset=".55" stop-color="#f27d65"/>
      <stop offset="1" stop-color="#e89e4c"/>
    </linearGradient>
    <linearGradient id="sunsetBorder" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5cad6"/>
      <stop offset="1" stop-color="#f7d6c4"/>
    </linearGradient>
    <linearGradient id="sunsetFadeRule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e85d88" stop-opacity=".65"/>
      <stop offset=".5" stop-color="#f27d65" stop-opacity=".35"/>
      <stop offset="1" stop-color="#e89e4c" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sunsetSea" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff7f8" stop-opacity="0"/>
      <stop offset=".42" stop-color="#ffe8ee" stop-opacity=".82"/>
      <stop offset="1" stop-color="#ffdfd6"/>
    </linearGradient>
    <radialGradient id="sunsetSunGlow" cx=".5" cy=".95" r=".65">
      <stop offset="0" stop-color="#ffd1b3" stop-opacity=".34"/>
      <stop offset=".55" stop-color="#ffb3c6" stop-opacity=".16"/>
      <stop offset="1" stop-color="#ffb3c6" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="seaClip"><rect width="880" height="150" rx="18"/></clipPath>
  </defs>
  <g clip-path="url(#seaClip)">
    <rect width="880" height="150" fill="url(#sunsetSea)"/>
    <rect width="880" height="150" fill="url(#sunsetSunGlow)"/>
    <g fill="none" stroke="#f08ca2" stroke-width="1.05" opacity=".35">
      <path d="M-80 108Q-20 100 40 108T160 108T280 108T400 108T520 108T640 108T760 108T880 108T1000 108"/>
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-120 0" dur="9s" repeatCount="indefinite"/>
    </g>
    <g fill="none" stroke="#f5a687" stroke-width=".95" opacity=".26">
      <path d="M-120 128Q-50 121 20 128T160 128T300 128T440 128T580 128T720 128T860 128T1000 128"/>
      <animateTransform attributeName="transform" type="translate" from="-140 0" to="0 0" dur="12s" repeatCount="indefinite"/>
    </g>
    <g transform="translate(52 88)">
              <g>
                <rect x="0" y="-54" width="226" height="44" rx="12" fill="#ffffff" stroke="url(#sunsetBorder)" stroke-width="1.1"/>
                <text x="13" y="-35" font-family="ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace" font-size="9.5" font-weight="600" fill="url(#sunsetText)">@wangshen233</text>
                <text x="13" y="-18" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans','Microsoft YaHei',sans-serif" font-size="11" fill="#2b1e24">座位 233 常年留空，点下方折一艘纸船放进晚霞吧～</text>

                <!-- Warm Sakura-Blush Origami Paper Boat -->
                <g transform="translate(34 10)">
                  <ellipse cx="0" cy="7.5" rx="24" ry="3.2" fill="#e85d88" opacity=".22"/>
                  <path d="M-21 0L21 0L13 8.5H-13Z" fill="#ffeef2" stroke="#e07587" stroke-width="1.05" stroke-linejoin="round"/>
                  <path d="M-12 0L0 -13L12 0Z" fill="#ffffff" stroke="#e07587" stroke-width="1" stroke-linejoin="round"/>
                  <path d="M0 -13V0" stroke="#e07587" stroke-width=".85" opacity=".75"/>
                </g>
                <animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0" dur="5.2s" begin="-0.0s" repeatCount="indefinite"/>
              </g>
            </g><g transform="translate(332 98)">
              <g>
                <rect x="0" y="-54" width="226" height="44" rx="12" fill="#ffffff" stroke="url(#sunsetBorder)" stroke-width="1.1"/>
                <text x="13" y="-35" font-family="ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace" font-size="9.5" font-weight="600" fill="url(#sunsetText)">@station-233</text>
                <text x="13" y="-18" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans','Microsoft YaHei',sans-serif" font-size="11" fill="#2b1e24">暮色海列全天候供应热美式，祝路过的你没有 bug</text>

                <!-- Warm Sakura-Blush Origami Paper Boat -->
                <g transform="translate(34 10)">
                  <ellipse cx="0" cy="7.5" rx="24" ry="3.2" fill="#e85d88" opacity=".22"/>
                  <path d="M-21 0L21 0L13 8.5H-13Z" fill="#ffeef2" stroke="#e07587" stroke-width="1.05" stroke-linejoin="round"/>
                  <path d="M-12 0L0 -13L12 0Z" fill="#ffffff" stroke="#e07587" stroke-width="1" stroke-linejoin="round"/>
                  <path d="M0 -13V0" stroke="#e07587" stroke-width=".85" opacity=".75"/>
                </g>
                <animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0" dur="6.0s" begin="-1.8s" repeatCount="indefinite"/>
              </g>
            </g><g transform="translate(610 86)">
              <g>
                <rect x="0" y="-54" width="226" height="44" rx="12" fill="#ffffff" stroke="url(#sunsetBorder)" stroke-width="1.1"/>
                <text x="13" y="-35" font-family="ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace" font-size="9.5" font-weight="600" fill="url(#sunsetText)">@sunset-fm</text>
                <text x="13" y="-18" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans','Microsoft YaHei',sans-serif" font-size="11" fill="#2b1e24">茜色の海を渡る風のように、好奇心のその先へ。</text>

                <!-- Warm Sakura-Blush Origami Paper Boat -->
                <g transform="translate(34 10)">
                  <ellipse cx="0" cy="7.5" rx="24" ry="3.2" fill="#e85d88" opacity=".22"/>
                  <path d="M-21 0L21 0L13 8.5H-13Z" fill="#ffeef2" stroke="#e07587" stroke-width="1.05" stroke-linejoin="round"/>
                  <path d="M-12 0L0 -13L12 0Z" fill="#ffffff" stroke="#e07587" stroke-width="1" stroke-linejoin="round"/>
                  <path d="M0 -13V0" stroke="#e07587" stroke-width=".85" opacity=".75"/>
                </g>
                <animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0" dur="5.5s" begin="-3.1s" repeatCount="indefinite"/>
              </g>
            </g>
  </g>
</svg>