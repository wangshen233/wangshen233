      <stop offset="0" stop-color="#ffc88a" stop-opacity=".32"/>
      <stop offset=".55" stop-color="#6ee7c8" stop-opacity=".14"/>
      <stop offset="1" stop-color="#ff8eb2" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="seaClip"><rect width="880" height="150" rx="18"/></clipPath>
  </defs>
  <g clip-path="url(#seaClip)">
