name: Update profile artwork

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/contributions.yml
      - tools/build_tag.py
      - tools/build_fun.py
      - tools/build_journey.py

permissions:
  contents: write

concurrency:
  group: contribution-animation
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Refresh FM 233.0 radio and cinema strip metrics
        run: python3 tools/build_tag.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: Platane/snk@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/contributions-light.svg?color_snake=#ff8a65&color_dots=#faf1f3,#fbd4df,#f6a6bd,#ec7296,#d64570
            assets/contributions-dark.svg?palette=github-dark&color_snake=#ffc078&color_dots=#1a1518,#3d222d,#703549,#b85270,#ff82a4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish updated artwork
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/contributions-light.svg assets/contributions-dark.svg \
            assets/fm233-light.svg assets/fm233-dark.svg \
            assets/tech-stack-light.svg assets/tech-stack-dark.svg \
            assets/cinema-*-light.svg assets/cinema-*-dark.svg
          if ! git diff --cached --quiet; then
            git commit -m 'Update profile artwork'
            git push origin HEAD:main
          fi
