name: Fly Visitor Paper Crane

on:
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: contribution-animation
  cancel-in-progress: false

jobs:
  fly:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.issue.title, '纸鹤') || contains(github.event.issue.title, '漂流瓶') || contains(github.event.issue.title, '🕊')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Update sea paper boats from latest visitor issues
        run: python3 tools/build_cranes.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
      - name: Commit updated sea horizon
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/paper-cranes-light.svg assets/paper-cranes-dark.svg
          if ! git diff --cached --quiet; then
            git commit -m '🕊️ Fly a new visitor paper crane across the sea'
            git push origin HEAD:main
          fi
